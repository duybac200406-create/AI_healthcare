
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: ai-healthcare-qdrant
    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"

    volumes:
      - ai-healthcare-qdrant-data:/qdrant/storage

volumes:
  ai-healthcare-qdrant-data:
    external: true
