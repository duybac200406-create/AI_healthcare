[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-healthcare"
version = "0.1.0"
description = "A safety-first Vietnamese healthcare assistant prototype using synthetic data"
readme = "docs/architecture/MVP_v0.1_quickstart.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.40,<2.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
